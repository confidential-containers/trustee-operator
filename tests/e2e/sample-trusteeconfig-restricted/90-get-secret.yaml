apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      set -e  # Exit on any error

      # Extract the HTTPS certificate from the secret and pipe it to the client pod
      kubectl get secret kbs-tls-secret -n trustee-operator-system -o jsonpath='{.data.tls\.crt}' | \
        base64 -d | \
        kubectl exec -i -n trustee-operator-system kbs-client -- sh -c 'cat > /tmp/https.crt'

      # Get the secret using HTTPS
      SECRET=$(kubectl exec -n trustee-operator-system kbs-client -- kbs-client --cert-file /tmp/https.crt --url https://kbs-service:8080 get-resource --path default/attestation-status/status)

      # Create the trustee-secret
      kubectl create secret generic trustee-secret --from-literal status="$SECRET" -n trustee-operator-system
