apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: cat https.crt | kubectl exec -i -n trustee-operator-system kbs-client -- sh -c 'cat > /tmp/https.crt' && SECRET=$(kubectl exec -n trustee-operator-system kbs-client -- kbs-client --cert-file /tmp/https.crt --url https://kbs-service:8080 get-resource --path default/attestation-status/status) && kubectl create secret generic trustee-secret --from-literal status=$SECRET -n trustee-operator-system
